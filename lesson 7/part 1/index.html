<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 7</title>
</head>
<body>
    <form  >
        <fieldset>
            <legend><strong>Personal Information</strong></legend>
            <label for="firstname">First Name:</label>
            <input type="text" name="firstname" id="firstname" value readonly>
            <label for="lastname">Last Name:</label>
            <input type="text" name="lastname" ><br>
            <label for="email">Email:</label><br>
            <input type="email" name="email" id="email" required><br>
            <label for="password">Password:</label><br>
            <input type="password" name="password" id="password" size="40" placeholder="Password"><br>
            <label>Gender:</label><br>
            <input type="radio" name="male" id="male" value="male">
            <label for="male">Male</label><br>
            <input type="radio" name="female" id="female" value="female">
            <label for="female">Female</label><br>
            <label>Hobbies:</label><br>
            <input type="checkbox" name="gaming" id="gaming" value="gaming">
            <label for="gaming">Gaming</label><br>
            <input type="checkbox" name="football" id="football" value="football">
            <label for="football">Football</label><br>
            <label for="pets">Choose a pet </label><br>
            <select name="pet" id="pet">
                <option value="Dog">Dog</option>
                <option value="Cat">Cat</option>
                <option value="Parrot">Parrot</option>


            </select><br><br>
      
      
      
      
        </fieldset>


    </form>
    
</body>
</html>
