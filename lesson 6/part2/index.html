<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital School | Success Stories</title>

    <link rel="icon" href="images/">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f5f7ff);
            color: #1e293b;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #102a56, #2563eb);
            color: white;
            text-align: center;
            padding: 45px 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        header p {
            font-size: 17px;
            color: #dbeafe;
        }

        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .section-title h2 {
            font-size: 27px;
            color: #163b75;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #64748b;
        }

        .iframe-box {
            background: white;
            padding: 15px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 35px;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 12px;
            display: block;
            background: #f1f5f9;
        }

        .button-container {
            text-align: center;
            margin: 25px 0;
        }

        .button {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s ease;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.25);
        }

        .button:hover {
            background: linear-gradient(135deg, #1e40af, #1e3a8a);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        footer {
            background: #102a56;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 50px;
        }

        footer p {
            font-size: 14px;
            color: #dbeafe;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 27px;
            }

            header p {
                font-size: 15px;
            }

            iframe {
                height: 400px;
            }

            .container {
                margin: 25px auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Digital School</h1>
        <p>Inspiration, Innovation and Success Stories</p>
    </header>

    <main class="container">

        <div class="section-title">
            <h2>Our Gallery</h2>
            <p>Explore our images and discover our digital world.</p>
        </div>

        <div class="iframe-box">
            <iframe src="images/images.png" title="Digital School Image Gallery">
            </iframe>
        </div>

        <div class="section-title">
            <h2>Success Stories</h2>
            <p>Discover inspiring stories from Digital School students.</p>
        </div>

        <div class="button-container">
            <a href="https://shkolladigjitale.com/" target="_blank" class="button">
                Explore Digital School →
            </a>
        </div>
        </div>
        </a>
        </div>

        <div class="iframe-box">
            <iframe name="iframe_ds" src="images/foto2.png" title="Digital School Success Stories">
            </iframe>
        </div>

    </main>

    <footer>
        <p>© 2026 Digital School | All Rights Reserved</p>
    </footer>

</body>

</html>
